<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radon">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="Saisie terrain des mesures radon — Code du Travail et Code de la Santé Publique">
  <title>Radon — Saisie terrain</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <div id="app-content"></div>
  </div>

  <div id="toast-container"></div>
  <div id="loading-overlay" class="hidden"><div class="spinner"></div></div>

  <script type="module">
    import { initApp, bindGlobalNav } from './js/app.js';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await initApp();
        bindGlobalNav();
      } catch (err) {
        console.error('Init error:', err);
        document.getElementById('app-content').innerHTML = `
          <div class="empty-state">
            <h2>Erreur d'initialisation</h2>
            <p>${err.message}</p>
          </div>
        `;
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
